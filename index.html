<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교도서관 감성디자인 프로젝트 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#20282b;--ink-soft:#5a686c;--paper:#ffffff;--card:#ffffff;--line:#e6e8e4;--teal:#356c66;--teal-deep:#204d48;--clay:#b06b45;--shadow:0 1px 2px rgba(32,40,43,.05),0 10px 30px rgba(32,40,43,.07);}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eceee9;--ink-soft:#a4b0ad;--paper:#12181a;--card:#1a2224;--line:#2a3638;--teal:#61a89f;--teal-deep:#8ed2c9;--clay:#d18e63;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}}
  :root[data-theme="dark"]{--ink:#eceee9;--ink-soft:#a4b0ad;--paper:#12181a;--card:#1a2224;--line:#2a3638;--teal:#61a89f;--teal-deep:#8ed2c9;--clay:#d18e63;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard",system-ui,-apple-system,sans-serif;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px;}
  header{padding:52px 0 30px;border-bottom:1px solid var(--line);}
  .kicker{font-size:12.5px;letter-spacing:.16em;color:var(--teal);font-weight:600;}
  h1{font-family:"Nanum Myeongjo",serif;font-weight:800;letter-spacing:-.015em;font-size:clamp(30px,5.2vw,50px);line-height:1.14;margin:.3em 0 .22em;}
  .lede{color:var(--ink-soft);font-size:15.5px;max-width:62ch;margin:0;}
  .lede em{color:var(--teal);font-style:normal;font-weight:700;font-size:16.5px;}
  .lede .note{color:var(--ink-soft);font-size:13px;}
  .count-line{margin-top:20px;font-size:14px;color:var(--ink-soft);}
  .count-line b{font-family:"Nanum Myeongjo",serif;color:var(--clay);font-weight:800;font-size:20px;}
  .filters{position:sticky;top:0;z-index:20;background:var(--paper);padding:18px 0 16px;border-bottom:1px solid var(--line);}
  .filter-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:13.5px;font-weight:600;color:var(--ink-soft);}
  select,input[type="search"]{font-family:inherit;font-size:15.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;width:100%;appearance:none;}
  select:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px;}
  .photo-only{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;height:40px;}
  .photo-only input{width:15px;height:15px;accent-color:var(--teal);cursor:pointer;}
  .reset{background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:9px;padding:9px 14px;font-family:inherit;font-size:13px;cursor:pointer;height:40px;white-space:nowrap;}
  .reset:hover{border-color:var(--teal);color:var(--teal);}
  .grid{display:grid;gap:22px;padding:30px 0 60px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease;}
  .card.has-photo{cursor:pointer;}
  .card.has-photo:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(32,40,43,.08),0 18px 44px rgba(32,40,43,.13);}
  .photo{position:relative;aspect-ratio:4/3;background:var(--line);overflow:hidden;}
  .photo svg{width:100%;height:100%;display:block;}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .ph-label{position:absolute;left:10px;bottom:10px;font-size:11px;background:rgba(32,40,43,.72);color:#fff;padding:3px 8px;border-radius:20px;}
  .count-badge{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:500;background:rgba(32,40,43,.78);color:#fff;padding:4px 10px;border-radius:20px;}
  .year-tab{position:absolute;right:12px;top:12px;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:15px;color:#fff;background:var(--teal-deep);padding:3px 12px;border-radius:20px;}
  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:9px;flex:1;}
  .school{font-family:"Pretendard",sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.24;margin:0;}
  .concept{color:var(--clay);font-size:13.5px;font-weight:500;margin:-3px 0 0;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;}
  .tag{font-size:12px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:3px 9px;}
  .tag.reg{border-color:var(--teal);color:var(--teal);}
  .meta-row{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:11px;margin-top:auto;font-size:12.5px;}
  .meta-row .stat{color:var(--ink-soft);}
  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-soft);}
  .empty b{color:var(--ink);display:block;font-size:18px;margin-bottom:6px;font-family:"Nanum Myeongjo",serif;}
  footer{border-top:1px solid var(--line);padding:24px 0 60px;color:var(--ink-soft);font-size:12.5px;}
  .modal{position:fixed;inset:0;z-index:100;background:rgba(18,22,24,.86);display:none;align-items:center;justify-content:center;padding:20px;}
  .modal.open{display:flex;}
  .modal-inner{background:var(--card);border-radius:16px;max-width:960px;width:100%;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;}
  .modal-head{display:flex;align-items:baseline;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .modal-head h3{font-family:"Pretendard",sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;}
  .modal-head .m-region{color:var(--teal);font-size:13px;font-weight:600;}
  .modal-head .m-concept{color:var(--clay);font-size:13px;}
  .modal-close{margin-left:auto;background:none;border:1px solid var(--line);color:var(--ink-soft);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px;}
  .modal-close:hover{border-color:var(--clay);color:var(--clay);}
  .m-meta{padding:6px 22px 0;font-size:13px;color:var(--ink-soft);}
  .stage{position:relative;background:#0c0f10;display:flex;align-items:center;justify-content:center;min-height:340px;flex:1;}
  .stage img{max-width:100%;max-height:64vh;object-fit:contain;display:block;}
  .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer;}
  .nav:hover{background:rgba(255,255,255,.28);}
  .nav.prev{left:14px;}.nav.next{right:14px;}
  .counter{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(12,15,16,.7);color:#fff;font-size:12.5px;padding:4px 12px;border-radius:20px;}
  .thumbs{display:flex;gap:8px;padding:12px 22px 18px;overflow-x:auto;}
  .thumbs img{width:74px;height:56px;object-fit:cover;border-radius:7px;cursor:pointer;opacity:.55;border:2px solid transparent;flex:0 0 auto;}
  .thumbs img.active{opacity:1;border-color:var(--teal);}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="kicker">강원특별자치도교육청 · 문화체육특수교육과</div>
  <h1>학교도서관 감성디자인 프로젝트 아카이브</h1>
  <p class="lede"><em>다른 학교 도서관은 어떻게 달라졌을까?</em> <span class="note">전교생 수는 2026. 4. 1. 기준입니다.</span></p>
  <div class="count-line"><b id="countNum">0</b> 개교</div>
</div></header>
<div class="filters"><div class="wrap"><div class="filter-grid">
  <div class="field"><label for="fYear">사업 연도</label><select id="fYear"><option value="">전체</option></select></div>
  <div class="field"><label for="fRegion">지역(교육지원청)</label><select id="fRegion"><option value="">전체</option></select></div>
  <div class="field"><label for="fLevel">학교급</label><select id="fLevel"><option value="">전체</option></select></div>
  <div class="field"><label for="fSize">전교생 수</label><select id="fSize"><option value="">전체</option><option value="a">100명 미만</option><option value="b">100~500명</option><option value="c">500명 이상</option></select></div>
  <div class="field"><label for="fArea">도서관 규모</label><select id="fArea"><option value="">전체</option><option value="s">소형 (~100㎡)</option><option value="m">중형 (100~200㎡)</option><option value="l">대형 (200㎡~)</option></select></div>
  <div class="field"><label for="fBudget">사업비</label><select id="fBudget"><option value="">전체</option><option value="b1">5천만원 미만</option><option value="b2">5천만~1억원 미만</option><option value="b3">1억~1억5천 미만</option><option value="b4">1억5천~2억 미만</option><option value="b5">2억원 이상</option></select></div>
  <div class="field"><label for="fText">학교명 검색</label><input type="search" id="fText" placeholder="예: 동호"></div>
  <label class="photo-only"><input type="checkbox" id="photoChk"> 사진 있는 학교만</label>
  <button class="reset" id="reset">초기화</button>
</div></div></div>
<main class="wrap"><div class="grid" id="grid"></div></main>
<footer><div class="wrap">강원특별자치도교육청 문화체육특수교육과</div></footer>
<div class="modal" id="modal"><div class="modal-inner">
  <div class="modal-head"><h3 id="mSchool"></h3><span class="m-region" id="mRegion"></span><span class="m-concept" id="mConcept"></span><button class="modal-close" id="mClose">✕</button></div>
  <div class="m-meta" id="mMeta"></div>
  <div class="stage"><button class="nav prev" id="mPrev">‹</button><img id="mImg" alt="시공 사진"><button class="nav next" id="mNext">›</button><div class="counter" id="mCounter"></div></div>
  <div class="thumbs" id="mThumbs"></div>
</div></div>

const REGION_ORDER=['춘천','홍천','철원','화천','양구','인제','원주','횡성','영월','평창','강릉','속초양양','동해','태백','삼척','정선','고성'];
const LEVEL_ORDER=['초','중','고','특'];
const LEVEL_FULL={'초':'초등학교','중':'중학교','고':'고등학교','특':'특수학교'};
const $=s=>document.querySelector(s);const grid=$("#grid");
function fillSel(id,values,order){const sel=$(id);let u=[...new Set(values)];if(order)u.sort((a,b)=>order.indexOf(a)-order.indexOf(b));else u.sort();u.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=(id==="#fLevel"?LEVEL_FULL[v]:v);sel.appendChild(o);});}
fillSel("#fYear",DATA.map(d=>d.year));fillSel("#fRegion",DATA.map(d=>d.region),REGION_ORDER);fillSel("#fLevel",DATA.map(d=>d.level),LEVEL_ORDER);
function sizeBucket(n){return n==null?"":n<100?"a":n<500?"b":"c";}
function areaBucket(a){return a==null?"":a<100?"s":a<200?"m":"l";}
function areaLabel(a){return a==null?"규모 미상":(a<100?"소형":a<200?"중형":"대형");}
function levelLabel(l){return LEVEL_FULL[l]||l;}
function budgetBucket(k){const w=k*1000;if(w<50000000)return"b1";if(w<100000000)return"b2";if(w<150000000)return"b3";if(w<200000000)return"b4";return"b5";}
function placeholder(tone){return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="${tone}" opacity="0.15"/><g fill="${tone}" opacity="0.5"><rect x="150" y="118" width="100" height="70" rx="6" fill="none" stroke="${tone}" stroke-width="3"/><circle cx="176" cy="146" r="11"/><path d="M162 182 L192 154 L214 172 L232 150 L238 182 Z"/></g><text x="200" y="228" text-anchor="middle" font-family="Pretendard,sans-serif" font-size="13" fill="${tone}" opacity="0.7">사진 준비 중</text></svg><span class="ph-label">사진 준비 중</span>`;}
let photoOnly=false;
function render(){
  const fy=$("#fYear").value,fr=$("#fRegion").value,fl=$("#fLevel").value,fs=$("#fSize").value,fa=$("#fArea").value,fb=$("#fBudget").value,ft=$("#fText").value.trim();
  const rows=DATA.filter(d=>(!fy||d.year==fy)&&(!fr||d.region===fr)&&(!fl||d.level===fl)&&(!fs||sizeBucket(d.students)===fs)&&(!fa||areaBucket(d.area)===fa)&&(!fb||budgetBucket(d.budget)===fb)&&(!ft||d.school.includes(ft))&&(!photoOnly||(d.photos&&d.photos.length>0)));
  $("#countNum").textContent=rows.length;
  if(!rows.length){grid.innerHTML=`<div class="empty"><b>검색 결과가 없습니다</b>조건을 바꾸거나 초기화를 눌러보세요.</div>`;return;}
  grid.innerHTML=rows.map(d=>{
    const pics=d.photos||[];const hasP=pics.length>0;
    const areaTxt=d.area!=null?`${areaLabel(d.area)} ${d.area}㎡`:'규모 미상';
    let ph=hasP?`<img src="${pics[0]}" alt="${d.school} 시공 사진" loading="lazy"><span class="count-badge">📷 사진 ${pics.length}장</span>`:placeholder(d.tone);
    return `<article class="card ${hasP?'has-photo':''}" data-id="${d.id}"><div class="photo">${ph}<span class="year-tab">${d.year}</span></div><div class="card-body"><h2 class="school">${d.school}</h2><p class="concept">${d.typ}</p><div class="tags"><span class="tag reg">${d.region}</span><span class="tag">${levelLabel(d.level)}</span><span class="tag">전교생 ${d.students!=null?d.students+'명':'미상'}</span><span class="tag">${areaTxt}</span></div><div class="meta-row"><span class="stat">${d.year}년 조성</span></div></div></article>`;
  }).join("");
}
let mImgs=[],mIdx=0;
function openModal(id){const d=DATA.find(x=>x.id==id);mImgs=(d.photos||[]).slice();mIdx=0;$("#mSchool").textContent=d.school;$("#mRegion").textContent=d.region;$("#mConcept").textContent=d.typ;$("#mMeta").textContent=`${d.year}년 조성 · ${levelLabel(d.level)} · 전교생 ${d.students}명 · ${areaLabel(d.area)} ${d.area||''}㎡`;$("#mThumbs").innerHTML=mImgs.map((s,i)=>`<img src="${s}" data-i="${i}">`).join("");showImg(0);$("#modal").classList.add("open");document.body.style.overflow="hidden";}
function showImg(i){if(!mImgs.length)return;mIdx=(i+mImgs.length)%mImgs.length;$("#mImg").src=mImgs[mIdx];$("#mCounter").textContent=`${mIdx+1} / ${mImgs.length}`;document.querySelectorAll("#mThumbs img").forEach((t,j)=>t.classList.toggle("active",j===mIdx));}
function closeModal(){$("#modal").classList.remove("open");document.body.style.overflow="";}
grid.addEventListener("click",e=>{const c=e.target.closest(".card.has-photo");if(c)openModal(c.dataset.id);});
$("#mPrev").addEventListener("click",()=>showImg(mIdx-1));$("#mNext").addEventListener("click",()=>showImg(mIdx+1));$("#mClose").addEventListener("click",closeModal);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
$("#mThumbs").addEventListener("click",e=>{if(e.target.dataset.i!=null)showImg(+e.target.dataset.i);});
document.addEventListener("keydown",e=>{if(!$("#modal").classList.contains("open"))return;if(e.key==="Escape")closeModal();if(e.key==="ArrowLeft")showImg(mIdx-1);if(e.key==="ArrowRight")showImg(mIdx+1);});
["#fYear","#fRegion","#fLevel","#fSize","#fArea","#fBudget"].forEach(id=>$(id).addEventListener("change",render));
$("#fText").addEventListener("input",render);
$("#photoChk").addEventListener("change",e=>{photoOnly=e.target.checked;render();});
$("#reset").addEventListener("click",()=>{["#fYear","#fRegion","#fLevel","#fSize","#fArea","#fBudget"].forEach(id=>$(id).value="");$("#fText").value="";$("#photoChk").checked=false;photoOnly=false;render();});
